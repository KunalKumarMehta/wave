<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wave Integration Test Page</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { padding: 8px; width: 250px; }
        button { padding: 10px 20px; cursor: pointer; }
        #status { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Wave Test Page</h1>
    <p>This page is used for testing Wave's DOM extraction and agent actions.</p>

    <nav>
        <a href="#home" id="link-home">Home</a> |
        <a href="#about" id="link-about">About</a> |
        <a href="#contact" id="link-contact">Contact</a>
    </nav>

    <div style="margin-top: 30px;">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="test@example.com" aria-label="Email">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" aria-label="Password">
        </div>
        <button id="login-btn" aria-label="Login">Login</button>
    </div>

    <div id="status">Ready</div>

    <script>
        document.getElementById('login-btn').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            document.getElementById('status').textContent = 'Logging in with ' + email;
        });

        window.addEventListener('hashchange', () => {
            document.getElementById('status').textContent = 'Navigated to ' + window.location.hash;
        });
    </script>
</body>
</html>
