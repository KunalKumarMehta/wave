name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Run tests
        run: cd packages/core && npx vitest run

      - name: Verify test count
        run: |
          TEST_COUNT=$(cd packages/core && npx vitest run --reporter=json | jq '.numTotalTests')
          echo "Test count: $TEST_COUNT"
          if [ "$TEST_COUNT" -lt 60 ]; then
            echo "Error: Test count is less than 60"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Extension
        run: pnpm --filter @wave/extension build

      - name: Check Extension Bundle Size
        run: |
          set -euo pipefail
          shopt -s nullglob
          # App-critical chunks only (exclude lazy-loaded WebLLM `index-*.js`).
          mapfile -t CHUNKS < <(printf '%s\n' \
            apps/extension/dist/assets/sidepanel.html-*.js \
            apps/extension/dist/assets/core-*.js \
            apps/extension/dist/assets/vendor-react-*.js)
          if [ "${#CHUNKS[@]}" -eq 0 ]; then
            echo "Error: No critical extension chunks matched in dist/assets/"
            ls -la apps/extension/dist/assets/ || true
            exit 1
          fi
          TOTAL=0
          for f in "${CHUNKS[@]}"; do
            SIZE=$(wc -c < "$f" | tr -d ' ')
            echo "$f: $SIZE bytes"
            TOTAL=$((TOTAL + SIZE))
          done
          echo "Combined critical chunks: $TOTAL bytes (lazy index-*.js excluded)"
          # ~260KB raw typical; allow headroom under 1.5 MiB combined.
          LIMIT=1572864
          if [ "$TOTAL" -gt "$LIMIT" ]; then
            echo "Error: Extension critical bundle size is too large ($TOTAL bytes > $LIMIT)"
            exit 1
          fi

      - name: Build Desktop Frontend
        run: cd apps/desktop && npx vite build
